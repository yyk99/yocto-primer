#@TYPE: Machine
#@NAME: Olimex CS-EP930x_A (Cirrus EP9301/EP9302)
#@DESCRIPTION: ARM920T board booted by RedBoot; mainline kernel with an appended DTB.

# ARM920T is ARMv4T, little-endian, no FPU (the Maverick Crunch engine is unused).
require conf/machine/include/arm/arch-armv4.inc
DEFAULTTUNE = "armv4t"

PREFERRED_PROVIDER_virtual/kernel = "linux-ep93xx"
PREFERRED_VERSION_linux-ep93xx = "6.12%"

# RedBoot passes ATAGS, not a DTB, so the DTB is appended to zImage (the
# kernel gets CONFIG_ARM_APPENDED_DTB and CONFIG_ARM_ATAG_DTB_COMPAT).
KERNEL_IMAGETYPE = "zImage"
KERNEL_DEVICETREE = "cirrus/ep9301-olimex.dtb"
KERNEL_DEVICETREE_BUNDLE = "1"

# RedBoot 'load -r -b 0x218000' then 'exec'; see the quickstart guide.
# TODO: confirm with 'fis list' on the board.
SERIAL_CONSOLES = "57600;ttyAM0"

MACHINE_FEATURES = "usbhost ext2 serial"
IMAGE_FSTYPES = "tar.gz ext4"
