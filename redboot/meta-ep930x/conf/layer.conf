# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-ep930x"
BBFILE_PATTERN_meta-ep930x = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-ep930x = "10"

LAYERDEPENDS_meta-ep930x = "core"
LAYERSERIES_COMPAT_meta-ep930x = "scarthgap"
