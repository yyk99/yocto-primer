# Distribution for the Olimex CS-EP930x_A: Poky's defaults plus our own policy.
#
# It builds on poky.conf, so the feature set, SDK settings and sanity checks
# stay as they were; only the identity and the C library are ours. Poky's
# TARGET_VENDOR ("-poky") is kept on purpose: it is part of the tmp/work
# directory names, and changing it rebuilds everything.
require conf/distro/poky.conf

DISTRO = "ep930x"
DISTRO_NAME = "EP930x development distro (based on Poky)"
DISTRO_VERSION = "0.1"

# musl instead of glibc: the board has about 32 MB RAM, and the root filesystem
# comes out about 30% smaller than with glibc, which also may not support
# ARMv4T any more (unverified). Changing it rebuilds the toolchain and the
# kernel.
TCLIBC = "musl"
