#@TYPE: Machine
#@NAME: QEMU ARMv8 machine booted through U-Boot
#@DESCRIPTION: qemuarm64 with U-Boot (qemu_arm64_defconfig) as the firmware, rootfs on NOR flash.

# Keep the "qemuarm64" override: linux-yocto's COMPATIBLE_MACHINE, KBRANCH
# and SRCREV_machine are keyed on it, and would skip this machine name.
MACHINEOVERRIDES =. "qemuarm64:"

# kernel-yocto defaults KMACHINE to ${MACHINE}, but the kernel-meta repo only
# has a BSP definition named "qemuarm64".
KMACHINE = "qemuarm64"

# poky's qemuarm64 already sets UBOOT_MACHINE = "qemu_arm64_defconfig".
require conf/machine/qemuarm64.conf

PREFERRED_PROVIDER_virtual/bootloader = "u-boot"
# Build u-boot whenever an image is built, so u-boot.bin lands in the deploy
# dir next to the disk image.
EXTRA_IMAGEDEPENDS += "virtual/bootloader"

# The root filesystem is a JFFS2 image that run-qemu.sh writes into NOR flash
# (bank 1); there is no disk. The kernel is not passed to QEMU with -kernel
# either: run-qemu.sh puts it in flash bank 0 and U-Boot starts it from there.
# The defaults suit the virt flash: 256 KiB erase blocks (JFFS2_ERASEBLOCK
# 0x40000) and no cleanmarkers (NOR). The endianness is set by hand: the
# default picked -b (big endian) for this image, which a little-endian arm64
# kernel cannot mount.
IMAGE_FSTYPES += "jffs2"
JFFS2_ENDIANNESS = "-l"
