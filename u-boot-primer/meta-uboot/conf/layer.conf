# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-uboot"
BBFILE_PATTERN_meta-uboot = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-uboot = "10"

LAYERDEPENDS_meta-uboot = "core"
LAYERSERIES_COMPAT_meta-uboot = "scarthgap"
