# MTD core, partitions from the kernel command line (mtdparts=), and block
# devices (/dev/mtdblockN) so JFFS2 can be mounted.
CONFIG_MTD=y
CONFIG_MTD_CMDLINE_PARTS=y
CONFIG_MTD_BLOCK=y
# The CFI (Intel command set) flash chips of the virt board, found through the
# "cfi-flash" node of the device tree.
CONFIG_MTD_CFI=y
CONFIG_MTD_CFI_INTELEXT=y
CONFIG_MTD_PHYSMAP=y
CONFIG_MTD_PHYSMAP_OF=y
# JFFS2, with the compressors mkfs.jffs2 uses by default.
CONFIG_JFFS2_FS=y
CONFIG_JFFS2_ZLIB=y
CONFIG_JFFS2_RTIME=y
