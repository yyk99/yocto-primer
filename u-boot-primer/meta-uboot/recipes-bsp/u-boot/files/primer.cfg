# Shows up in the banner ("U-Boot 2024.01-primer"), so you can tell your
# build from any other.
CONFIG_LOCALVERSION="-primer"
# Longer window to press a key and stop autoboot.
CONFIG_BOOTDELAY=5
# QEMU's virt flash is two x16 chips interleaved on a 32-bit bus. The
# defconfig probes ports upward from 8 bits and settles on 16, which sees only
# half of each bank (32 MB, 128 KiB sectors). Start probing at 32 bits instead.
# CONFIG_SYS_FLASH_CFI_WIDTH_8BIT is not set
CONFIG_SYS_FLASH_CFI_WIDTH_32BIT=y
# JFFS2 commands: ls, fsload, fsinfo (select the partition with chpart).
CONFIG_CMD_JFFS2=y
# Program the emulated NOR flash one word at a time. With buffered writes
# (the defconfig default) `saveenv` fails with "Flash buffer write timeout",
# at both 16 and 32 bit port widths, so QEMU's flash model is the likely cause.
# CONFIG_SYS_FLASH_USE_BUFFER_WRITE is not set
