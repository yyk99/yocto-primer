# Shows up in the banner ("U-Boot 2024.01-primer"), so you can tell your
# build from any other.
CONFIG_LOCALVERSION="-primer"
# Longer window to press a key and stop autoboot.
CONFIG_BOOTDELAY=5
# Program the emulated NOR flash one word at a time. With buffered writes
# (the defconfig default) `saveenv` fails with "Flash buffer write timeout".
# QEMU's flash model is the likely cause (to be confirmed by rebuilding).
# CONFIG_SYS_FLASH_USE_BUFFER_WRITE is not set
